[package]
name = "liveemail"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liveemail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
rusqlite = { version = "0.41", features = ["bundled"] }

# 凭据（Windows 凭据管理器）
keyring = { version = "4", features = ["v1"] }

# 错误处理 / 日志
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 异步运行时
tokio = { version = "1", features = ["net", "time", "io-util", "rt-multi-thread", "macros"] }

# 邮件协议（连接测试用；完整收发在后续批次）
async-imap = { version = "0.12", features = ["runtime-tokio"] }

# TLS 统一走 ring 后端（aws-lc-sys 需要 NASM，本机不可用）
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
mail-send = { version = "0.7", default-features = false, features = ["ring", "tls12", "builder"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
